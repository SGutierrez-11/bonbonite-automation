name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 12:00 UTC equivale a las 07:00 en Colombia (UTC-5).
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Filtro de etiquetas de Cucumber'
        required: false
        default: 'not @wip'
      browser:
        description: 'Navegador'
        required: false
        default: 'chrome'
        type: choice
        options: [chrome, firefox]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_URL: https://sgutierrez-11.github.io/bonbonite-automation
  # Fecha en la que termina la ventana de ejecucion diaria acordada.
  SCHEDULE_END_DATE: '2026-09-16'

jobs:

  planificacion:
    name: Planificación de la corrida
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ejecutar: ${{ steps.plan.outputs.ejecutar }}
      tags: ${{ steps.plan.outputs.tags }}
      hilos: ${{ steps.plan.outputs.hilos }}
    steps:
      - name: Decidir alcance y vigencia
        id: plan
        run: |
          hoy=$(date -u +%Y-%m-%d)
          evento="${{ github.event_name }}"

          if [ "$evento" = "schedule" ] && [ "$hoy" \> "$SCHEDULE_END_DATE" ]; then
            echo "La ventana de ejecucion diaria termino el $SCHEDULE_END_DATE. Se omite la corrida."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La corrida programada recorre toda la suite, pero en secuencial. El
          # sitio bajo prueba es de produccion y responde 403 cuando detecta
          # trafico automatizado concurrente, asi que un solo hilo reduce el
          # riesgo de que el WAF bloquee la ejecucion.
          case "$evento" in
            schedule)          tags='not @wip'; hilos=1 ;;
            workflow_dispatch) tags='${{ github.event.inputs.tags }}'; hilos=1 ;;
            *)                 tags='@smoke';   hilos=1 ;;
          esac

          echo "Evento: $evento | Fecha: $hoy | Etiquetas: $tags | Hilos: $hilos"
          echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "hilos=$hilos" >> "$GITHUB_OUTPUT"

  tests:
    name: Suite web
    needs: planificacion
    if: needs.planificacion.outputs.ejecutar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar la suite
        run: >
          ./mvnw -B clean test -pl runner -am
          -Dheadless.mode=true
          -DthreadCount=${{ needs.planificacion.outputs.hilos }}
          "-Dcucumber.filter.tags=${{ needs.planificacion.outputs.tags }}"
          -Dbrowser.name=${{ github.event.inputs.browser || 'chrome' }}
        env:
          CUSTOMER_DOCUMENT: ${{ secrets.CUSTOMER_DOCUMENT }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}

      # Allure construye la grafica de tendencia a partir del historial de la
      # ejecucion anterior. Se recupera del reporte ya publicado; si todavia no
      # existe, el reporte se genera igual y solo pierde la tendencia.
      - name: Recuperar el historial del reporte anterior
        if: always()
        run: |
          mkdir -p runner/target/allure-results/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sfL "${PAGES_URL}/history/$f" -o "runner/target/allure-results/history/$f" || true
          done

      - name: Generar el reporte de Allure
        if: always()
        run: ./mvnw -B allure:report -pl runner

      - name: Publicar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: runner/target/allure-results
          retention-days: 14

      - name: Preparar el reporte para GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: runner/target/site/allure-maven-plugin

  publish:
    name: Publicar el reporte
    needs: tests
    if: always() && needs.tests.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
