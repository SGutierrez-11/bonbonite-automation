name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Filtro de etiquetas de Cucumber'
        required: false
        default: '@smoke'
      browser:
        description: 'Navegador'
        required: false
        default: 'chrome'
        type: choice
        options: [chrome, firefox]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_URL: https://sgutierrez-11.github.io/bonbonite-automation

jobs:

  tests:
    name: Suite web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar la suite
        run: >
          ./mvnw -B clean test -pl runner -am
          -Dheadless.mode=true
          -DthreadCount=2
          "-Dcucumber.filter.tags=${{ github.event.inputs.tags || '@smoke' }}"
          -Dbrowser.name=${{ github.event.inputs.browser || 'chrome' }}
        env:
          CUSTOMER_DOCUMENT: ${{ secrets.CUSTOMER_DOCUMENT }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}

      # Allure construye la gráfica de tendencia a partir del historial de la
      # ejecución anterior. Se recupera del reporte ya publicado; si todavía no
      # existe, el reporte se genera igual y solo pierde la tendencia.
      - name: Recuperar el historial del reporte anterior
        if: always()
        run: |
          mkdir -p runner/target/allure-results/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sfL "${PAGES_URL}/history/$f" -o "runner/target/allure-results/history/$f" || true
          done

      - name: Generar el reporte de Allure
        if: always()
        run: ./mvnw -B allure:report -pl runner

      - name: Publicar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: runner/target/allure-results
          retention-days: 14

      - name: Preparar el reporte para GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: runner/target/site/allure-maven-plugin

  publish:
    name: Publicar el reporte
    needs: tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
