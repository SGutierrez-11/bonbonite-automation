########################## NAVEGADOR ##########################
browser.name=chrome
headless.mode=false
window.size=1920,1080
private.mode=true

########################## RITMO ##############################
# Segundos de pausa entre escenarios. El sitio bajo prueba limita el trafico
# automatizado y responde 403 cuando recibe muchas peticiones seguidas.
scenario.pacing.seconds=5

########################## ESPERAS ############################
wait.implicit=5
wait.explicit=30

########################## SELENIUM GRID ######################
selenium.grid=false
selenium.grid.url=http://localhost:4444

########################## EVIDENCIAS #########################
screenshot.on.step=false
video.enabled=false

########################## API ################################
api.response.logging=true
